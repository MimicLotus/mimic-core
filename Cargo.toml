[workspace]
resolver = "2"
members = [
    "crates/mimic-core",
    "crates/mimic-brain",
]

[workspace.dependencies]
alpm = "5.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
indicatif = "0.17"
tempfile = "3.17"
which = "7.0"
regex = "1.11"
sha2 = "0.10"
zstd = "0.13"
tar = "0.4"
flate2 = "1.0"
